name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Instala dependências
        run: pip install -r requirements.txt

      - name: Config de teste
        run: cp config.example.py config.py

      - name: Roda testes (com gate de cobertura, ver pytest.ini --cov-fail-under)
        run: pytest

      - name: Gera badge de cobertura
        run: coverage-badge -o coverage.svg -f

      - name: Commita badge atualizado
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: atualiza badge de cobertura [skip ci]"
          file_pattern: coverage.svg
