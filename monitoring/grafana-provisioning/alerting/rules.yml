apiVersion: 1

groups:
  - orgId: 1
    name: agente-ia-alerts
    folder: Agente IA Local
    interval: 1m
    rules:
      - uid: ia-circuit-breaker-open
        title: "Circuit breaker aberto"
        condition: C
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker aberto pra tool={{ $labels.tool }} — parou de tentar depois de falhas seguidas"
        data:
          - refId: A
            datasourceUid: prometheus_ia
            relativeTimeRange: { from: 300, to: 0 }
            model:
              expr: max by (tool) (ia_circuit_breaker_open)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      - uid: ia-tool-success-rate-low
        title: "Taxa de sucesso baixa numa ferramenta"
        # mesmo threshold do frontend (Header.tsx: ALERT_MIN_CALLS=3, success_rate<70)
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tool={{ $labels.tool }} com taxa de sucesso abaixo de 70% (janela de 7 dias, mín. 3 chamadas)"
        data:
          - refId: A
            datasourceUid: prometheus_ia
            relativeTimeRange: { from: 300, to: 0 }
            model:
              expr: ia_tool_success_rate_percent < 70 and ia_tool_calls >= 3
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [70] }
              refId: C

      - uid: ia-llm-error-rate-high
        title: "Taxa de erro alta num modelo LLM"
        # mesmo threshold do frontend (Header.tsx: ALERT_MIN_CALLS=3, error_rate>20)
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Model={{ $labels.model }} com taxa de erro acima de 20% (janela de 24h, mín. 3 chamadas)"
        data:
          - refId: A
            datasourceUid: prometheus_ia
            relativeTimeRange: { from: 300, to: 0 }
            model:
              expr: ia_llm_error_rate_percent > 20 and ia_llm_calls >= 3
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [20] }
              refId: C

      - uid: ia-vram-quase-cheia
        title: "VRAM quase cheia"
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "VRAM em {{ $values.A }}% — risco de OOM/thrashing (ex: disputa Ollama x generate_image, já documentado)"
        data:
          - refId: A
            datasourceUid: prometheus_ia
            relativeTimeRange: { from: 300, to: 0 }
            model:
              expr: ia_vram_pct
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90] }
              refId: C
