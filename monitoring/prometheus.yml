global:
  scrape_interval: 15s

scrape_configs:
  - job_name: ia-agent
    metrics_path: /metrics/prometheus
    static_configs:
      # host.docker.internal — o agente normalmente roda direto no Windows
      # host (iniciar_frontend.bat), não dentro do compose. Se rodar via
      # `docker compose up agent` em vez disso, troque para "agent:8000".
      - targets: ["host.docker.internal:8000"]
